# Production stack for Dokploy / self-hosted deploy.
# Set DATABASE_URL (e.g. Supabase pooler) in Dokploy env — Postgres is not bundled here.
#
# Quick start (local smoke):
#   cp .env.example .env   # fill DATABASE_URL, secrets
#   docker compose up --build
#
# Dokploy (preferred full stack):
#   Create a Compose application with this file (build context = backend/).
#   Paste production secrets into Environment (Dokploy writes .env next to compose).
#   Domains → service `api`, port 8000, host api.mallaapp.org
#   Do not publish worker / beat / redis publicly.
#   Compose forces REDIS_URL to redis://redis:6379/0 (ignore localhost from host .env).
#
# See DOKPLOY.md for step-by-step.

services:
  api:
    build: .
    image: momentra-api:latest
    restart: unless-stopped
    # Local smoke binds host port. Dokploy Traefik uses Domains → api:8000;
    # host publish is optional there (set API_PUBLISH_PORT empty only if your
    # Compose version supports omitting published ports; otherwise leave default).
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    expose:
      - "8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Compose service hostname (overrides host .env localhost Redis).
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS_ON_START: "${RUN_MIGRATIONS_ON_START:-true}"
    env_file:
      - .env
    volumes:
      - api_uploads:/app/.local-uploads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  worker:
    build: .
    image: momentra-api:latest
    restart: unless-stopped
    command: ["worker"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS_ON_START: "false"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  beat:
    build: .
    image: momentra-api:latest
    restart: unless-stopped
    command: ["beat"]
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      RUN_MIGRATIONS_ON_START: "false"
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  api_uploads:
  redis_data:
