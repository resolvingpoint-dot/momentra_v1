type BusinessPulse {
  isEmpty: Boolean!
  activeMomentCount: Int!
  heroBadge: String!
  heroTitle: String!
  heroTitleAccent: String
  heroSubtitle: String!
  heroIllustrationUrl: String
  ctaLabel: String!
  trustLine: String
  secondaryCtaLabel: String
  dimensionsSectionTitle: String!
  dimensionsSectionSubtitle: String
  exploreMomentsLabel: String
  benefitsSectionTitle: String!
  benefits: [PulseEmptyItem!]!
  dimensionCards: [PulseTypeCard!]!
  avatarImageUrl: String
}

type GroupActivity {
  id: ID!
  title: String!
  occurredAt: String
}

type GroupActivityConnection {
  edges: [GroupActivityEdge!]!
  nodes: [GroupActivity!]!
  pageInfo: PageInfo!
}

type GroupActivityEdge {
  cursor: String!
  node: GroupActivity!
}

type GroupExpense {
  id: ID!
  amount: Int!
  currencyCode: String!
  title: String
  paidBy: GroupExpensePaidBy
}

type GroupExpenseConnection {
  edges: [GroupExpenseEdge!]!
  nodes: [GroupExpense!]!
  pageInfo: PageInfo!
}

type GroupExpenseEdge {
  cursor: String!
  node: GroupExpense!
}

type GroupExpensePaidBy {
  id: ID!
}

type GroupMoment {
  id: ID!
  title: String
  status: String!
  members: [GroupMomentMember!]!
  balances: [GroupMomentBalance!]!
  expenses(first: Int! = 20, after: String = null): GroupExpenseConnection!
  recentActivity(first: Int! = 10, after: String = null): GroupActivityConnection!
}

type GroupMomentBalance {
  memberId: ID!
  netAmount: Int!
  currencyCode: String!
  displayName: String!
}

type GroupMomentMember {
  id: ID!
  displayName: String!
  role: String!
  userId: ID
}

type GroupPulse {
  isEmpty: Boolean!
  activeMomentCount: Int!
  heroTitle: String!
  heroSubtitle: String!
  heroImageUrl: String
  ctaLabel: String!
  typeSectionTitle: String!
  typeSectionSubtitle: String!
  typeCards: [PulseTypeCard!]!
  whyGroups: [PulseEmptyItem!]!
  magicIntro: String!
  magicSteps: [PulseEmptyItem!]!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type PersonalPulse {
  overallRhythmState: String!
  activeMomentCount: Int!
  isEmpty: Boolean!
  heroImageUrl: String!
  heroTitle: String
  heroSubtitle: String
  journeyTitle: String
  journeySubtitle: String
  ctaLabel: String
  lifeOperations: JSON
  futureBuilding: JSON
  lifestyle: JSON
  emotionalSecurity: JSON
}

type PulseEmptyItem {
  itemCode: String!
  itemKind: String!
  title: String!
  description: String
  iconName: String
  imageUrl: String
  displayOrder: Int!
}

union PulseResult = PersonalPulse | GroupPulse | BusinessPulse

enum PulseScopeGQL {
  PERSONAL
  GROUP
  BUSINESS
}

type PulseTypeCard {
  momentTypeId: ID!
  momentTypeCode: String!
  momentTypeName: String!
  description: String
  createTagline: String
  iconName: String
  imageUrl: String
  accentMain: String
  accentSoftTint: String
  displayOrder: Int!
  linkedMomentId: ID
  linkedMomentStatus: String
  actionLabel: String
}

type Query {
  groupMoment(id: ID!): GroupMoment
  pulse(scope: PulseScopeGQL!, forceRefresh: Boolean! = false, momentType: String = null, workspaceId: ID = null): PulseResult!
  health: String!
}
