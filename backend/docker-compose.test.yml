services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: momentra
      POSTGRES_PASSWORD: momentra_test
      POSTGRES_DB: momentra_test
    # Use 15433 — avoid 5433 when a local Windows Postgres already binds it
    # (host then hits the wrong server → InvalidPasswordError for user momentra).
    ports:
      - "15433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momentra -d momentra_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
